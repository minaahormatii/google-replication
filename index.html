<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
      integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link href="styles/main.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="page-container">
      <header>
        <nav>
          <div class="nav-label">
            <a href="#">About</a>
            <a href="#">Store</a>
          </div>
          <div class="nav-label">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <i class="fa-solid fa-flask"></i>
            <i class="fa-solid fa-braille"></i>
            <span class="avatar">MH</span>
          </div>
        </nav>
      </header>
      <section class="hero-wrapper">
        <div class="hero-content">
          <a href="#"
            ><img
              src="./assets/google-logo.png"
              alt="Google Logo"
              class="google-logo"
          /></a>
        </div>
      </section>
      <main>
        <div class="search-bar">
          <div class="plus"><i class="fa-solid fa-plus"></i></div>

          <input type="text" placeholder="Search Google or type a URL" />

          <div class="microphone"><i class="fa-solid fa-microphone"></i></div>
          <div class="camera"><i class="fa-solid fa-camera"></i></div>
          <div class="AI-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i> <span>AI Mode</span>
          </div>
        </div>
        <div class="google-search">
          <button class="search-button">Google Search</button>
          <button class="search-button">I'm Feeling Lucky</button>
        </div>
        <div class="nba-final">
          <a href="#"
            >The NBA Finals start today, relive the best Playoff moments with AI
            Mode 🏀</a
          >
        </div>
      </main>
      <footer>
        <div class="footer-wrapper">
          <div class="business">
            <a href="#">Advertising</a>
            <a href="#">Business</a>
            <a href="#">How Search works</a>
          </div>
          <div class="AI">
            <a href="#"
              ><img src="./assets/leaf.png" alt="Leaf Icon" /> AI towards
              science and the environment</a
            >
          </div>
          <div class="settings">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Settings</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
